name: Build KiCom 0.9.7 Resilient Autonomy

on:
  push:
    paths:
      - '.github/triggers/build-097.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          BASE='releases/0.9.6/KiCom-0.9.6-Autonomy-Bridge.zip'
          OUT='/tmp/KiCom-0.9.7-Resilient-Autonomy.zip'
          LOG='build/status/0.9.7.log'
          STATUS='build/status/0.9.7.json'
          mkdir -p build/status releases/0.9.7 source/0.9.7
          : > "$LOG"
          result=failed
          stage=builder
          risk=unknown
          pkg_sha=''
          set +e
          python tools/build_097_resilient_autonomy.py "$BASE" "$OUT" >"$LOG" 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            stage=publish
            risk=yellow
            pkg_sha="$(sha256sum "$OUT" | awk '{print $1}')"
            cp "$OUT" releases/0.9.7/KiCom-0.9.7-Resilient-Autonomy.zip
            rm -rf /tmp/k097src source/0.9.7
            mkdir -p /tmp/k097src source/0.9.7
            unzip -q "$OUT" -d /tmp/k097src
            cp -a /tmp/k097src/. source/0.9.7/
            export pkg_sha
            python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('channel.json'); d=json.loads(p.read_text())
          v='0.9.7'; sha=os.environ['pkg_sha']
          d['releases']=[r for r in d.get('releases',[]) if r.get('version')!=v]
          d['releases'].insert(0,{
            'version':v,
            'url':'https://raw.githubusercontent.com/cschymura/kicom-update-mirror/main/releases/0.9.7/KiCom-0.9.7-Resilient-Autonomy.zip',
            'sha256':sha,
            'published_at':datetime.now(timezone.utc).isoformat()
          })
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('source/0.9.7/SOURCE-SNAPSHOT.json').write_text(json.dumps({
            'schema':1,'product':'kicom','version':v,'release_sha256':sha,
            'source_of_truth':'releases/0.9.7/KiCom-0.9.7-Resilient-Autonomy.zip',
            'runtime_state_removed':True,
            'policy':'immutable release-derived minimal update source snapshot',
            'github_role':'temporary-fallback-transport-only'
          },indent=2)+'\n')
          PY
            result=success
            stage=complete
          else
            risk=unknown
          fi
          export result stage rc risk pkg_sha
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          Path('build/status/0.9.7.json').write_text(json.dumps({
            'schema':1,'product':'kicom','version':'0.9.7',
            'result':os.environ['result'],'stage':os.environ['stage'],
            'exit_code':int(os.environ['rc']),'risk':os.environ['risk'],
            'package_sha256':os.environ['pkg_sha'],
            'updated_at':datetime.now(timezone.utc).isoformat(),
            'transport_role':'temporary-fallback-mirror; KiCom remains authority'
          },indent=2)+'\n')
          PY
          git config user.name 'kicom-bootstrap-bot'
          git config user.email 'kicom-bootstrap-bot@users.noreply.github.com'
          git add build/status/0.9.7.json build/status/0.9.7.log
          if [ "$result" = success ]; then
            git add releases/0.9.7 source/0.9.7 channel.json
          fi
          git commit -m "KiCom 0.9.7 build result: $result" || true
          git push
          exit "$rc"
