name: KiCom DEV97 one-tree input integrity
on:
  push:
    branches:
      - work/kicom-engram-dev97-native-one-tree
    paths:
      - 'development/0.9.27/engram/**'
      - '.github/workflows/test-kicom-dev97-one-tree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Reject malformed patch headers and missing native modules
        run: |
          set -euo pipefail
          python3 -m py_compile development/0.9.27/engram/dev97/stage_native_one_tree.py development/0.9.27/engram/dev97/test_integration_inputs.py
          python3 development/0.9.27/engram/dev97/test_integration_inputs.py
