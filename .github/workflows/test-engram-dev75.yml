name: KiCom Engram DEV75 canonical schema adapter
on:
  push:
    branches: [work/kicom-engram-dev70-mutation-core]
    paths: ['development/0.9.27/engram/dev75/**','.github/workflows/test-engram-dev75.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'pdo_sqlite,sqlite3', coverage: none}
      - name: Original R3 integrity
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint and canonical-schema tests
        run: |
          set -euo pipefail
          php -l development/0.9.27/engram/dev75/KiComEngramRevisionAdapter.php
          php -l development/0.9.27/engram/dev75/test_revision_adapter.php
          php development/0.9.27/engram/dev75/test_revision_adapter.php
