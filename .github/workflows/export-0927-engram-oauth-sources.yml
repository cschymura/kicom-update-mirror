name: Mirage verified OAuth/MCP source handoff
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - '.github/workflows/export-0927-engram-oauth-sources.yml'
      - 'development/0.9.27/engram/KiComEngramOAuthHttp.php'
      - 'development/0.9.27/engram/KiComEngramOAuthTransactions.php'
      - 'development/0.9.27/engram/KiComEngramOAuthAuthorizeHttp.php'
      - 'development/0.9.27/engram/mirage-oauth-client.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-code:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify original KiCom root and lint all first-party OAuth modules
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          for f in KiComEngramOAuthTransactions.php KiComEngramOAuthHttp.php KiComEngramOAuthPasskeyConsent.php KiComEngramOAuthAuthorizeHttp.php KiComEngramOAuthMcpHostBridge.php; do
            php -l "development/0.9.27/engram/$f"
          done
          node --check development/0.9.27/engram/mirage-oauth-client.js
          sha256sum development/0.9.27/engram/KiComEngramOAuth*.php development/0.9.27/engram/mirage-oauth-client.js > development/0.9.27/engram/OAUTH-SOURCE-CHECKSUMS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mirage-dev57-exact-oauth-source
          path: |
            development/0.9.27/engram/KiComEngramOAuthTransactions.php
            development/0.9.27/engram/KiComEngramOAuthHttp.php
            development/0.9.27/engram/KiComEngramOAuthPasskeyConsent.php
            development/0.9.27/engram/KiComEngramOAuthAuthorizeHttp.php
            development/0.9.27/engram/KiComEngramOAuthMcpHostBridge.php
            development/0.9.27/engram/mirage-oauth-client.js
            development/0.9.27/engram/OAUTH-SOURCE-CHECKSUMS.sha256
          retention-days: 7
          if-no-files-found: error
