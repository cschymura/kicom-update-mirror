name: KiCom DEV81 atomic OAuth access and refresh issue
on:
  push:
    branches:
      - work/kicom-engram-dev81-atomic-oauth
    paths:
      - 'development/0.9.27/engram/dev81/**'
      - 'development/0.9.27/engram/dev77/**'
      - '.github/workflows/test-kicom-dev81-atomic-oauth.yml'
  workflow_dispatch:

jobs:
  sqlite-atomic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP SQLite environment and syntax
        run: |
          php -v
          php -m | grep -i pdo_sqlite
          php -l development/0.9.27/engram/dev81/KiComEngramOAuthAtomicExchange.php
          php -l development/0.9.27/engram/dev81/test_atomic_exchange.php
      - name: Real SQLite transactional positive and negative checks
        run: php development/0.9.27/engram/dev81/test_atomic_exchange.php
          php development/0.9.27/engram/dev77/test-oauth-continuity.php
