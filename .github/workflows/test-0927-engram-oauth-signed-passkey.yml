name: KiCom Engram original signed Passkey OAuth consent
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramOAuthTransactions.php'
      - 'development/0.9.27/engram/KiComEngramOAuthPasskeyConsent.php'
      - 'development/0.9.27/engram/test-engram-oauth-signed-passkey.php'
      - '.github/workflows/test-0927-engram-oauth-signed-passkey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl,sodium
          coverage: none
      - name: Verify original KiCom release and source integrity
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Verify the original KiCom passkey bridge matches 0.9.31 installed-source hash
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object source/0.9.26-r3/modules/dev/PasskeyBridge.php)" = "57023a0681702cf63cefe1f75dc71b0eed7e2cb7"
      - name: Lint and verify real synthetic P-256 WebAuthn -> OAuth code -> private owner token
        shell: bash
        run: |
          set -euo pipefail
          for file in KiComEngramOAuthTransactions.php KiComEngramOAuthPasskeyConsent.php KiComEngramPrivateOwnerRegistry.php test-engram-oauth-signed-passkey.php test-engram-oauth-transactions.php; do
            php -l "development/0.9.27/engram/$file"
          done
          php development/0.9.27/engram/test-engram-oauth-transactions.php
          php development/0.9.27/engram/test-engram-oauth-signed-passkey.php
