name: KiCom Engram OAuth to private MCP host end-to-end
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramOAuthMcpHostBridge.php'
      - 'development/0.9.27/engram/test-engram-oauth-mcp-host-bridge.php'
      - 'development/0.9.27/engram/KiComEngramOAuthTransactions.php'
      - 'development/0.9.27/engram/KiComEngramOAuthHttp.php'
      - 'development/0.9.27/engram/KiComEngramMcpProtocol.php'
      - 'development/0.9.27/engram/KiComEngramMcpRuntimeGate.php'
      - '.github/workflows/test-0927-engram-oauth-mcp-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl
          coverage: none
      - name: Verify immutable original KiCom R3 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint bridge and test OAuth-code to private MCP SQLite recall and revocation
        shell: bash
        run: |
          set -euo pipefail
          for f in KiComEngramOAuthMcpHostBridge.php KiComEngramOAuthHttp.php KiComEngramOAuthTransactions.php KiComEngramMcpProtocol.php KiComEngramMcpRuntimeGate.php KiComEngramMcpJsonAdapter.php KiComEngramMcpController.php KiComEngramMcpContract.php KiComEngramStore.php KiComEngramPrivateOwnerRegistry.php test-engram-oauth-mcp-host-bridge.php; do
            php -l "development/0.9.27/engram/$f"
          done
          php development/0.9.27/engram/test-engram-oauth-mcp-host-bridge.php
