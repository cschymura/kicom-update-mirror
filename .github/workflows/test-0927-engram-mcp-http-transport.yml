name: KiCom Engram authenticated MCP HTTPS transport
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramMcpBearerVerifier.php'
      - 'development/0.9.27/engram/KiComEngramMcpHttpTransport.php'
      - 'development/0.9.27/engram/test-engram-mcp-http-transport.php'
      - '.github/workflows/test-0927-engram-mcp-http-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl
          coverage: none
      - name: Verify immutable original KiCom release
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint and execute HTTP+bearer+MCP+SQLite synthetic end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          for file in KiComEngramMcpBearerVerifier.php KiComEngramMcpHttpTransport.php KiComEngramMcpProtocol.php KiComEngramMcpRuntimeGate.php KiComEngramMcpJsonAdapter.php KiComEngramMcpController.php KiComEngramMcpContract.php KiComEngramStore.php test-engram-mcp-http-transport.php; do
            php -l "development/0.9.27/engram/$file"
          done
          php development/0.9.27/engram/test-engram-mcp-http-transport.php
