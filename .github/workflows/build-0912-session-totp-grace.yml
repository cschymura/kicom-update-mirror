name: Build KiCom 0.9.12 Session TOTP Grace

on:
  push:
    paths:
      - 'tools/build_0912_session_totp_grace.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          BASE='source/0.9.11'
          OUT='/tmp/KiCom-0.9.12-Session-TOTP-Grace.zip'
          LOG='build/status/0.9.12.log'
          mkdir -p build/status releases/0.9.12 source/0.9.12
          : > "$LOG"
          result=failed; stage=builder; risk=unknown; pkg_sha=''
          set +e
          python tools/build_0912_session_totp_grace.py "$BASE" "$OUT" >"$LOG" 2>&1
          rc=$?
          set -e
          if [ -f "$LOG" ]; then
            risk="$(grep -E '^RISK=' "$LOG" | tail -1 | cut -d= -f2 || true)"
            [ -n "$risk" ] || risk=unknown
          fi
          if [ $rc -eq 0 ] && [ -f "$OUT" ]; then
            stage=publish
            pkg_sha="$(sha256sum "$OUT" | awk '{print $1}')"
            cp "$OUT" releases/0.9.12/KiCom-0.9.12-Session-TOTP-Grace.zip
            rm -rf /tmp/k0912src source/0.9.12
            mkdir -p /tmp/k0912src source/0.9.12
            unzip -q "$OUT" -d /tmp/k0912src
            cp -a /tmp/k0912src/. source/0.9.12/
            export pkg_sha
            python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('channel.json'); d=json.loads(p.read_text())
          v='0.9.12'; sha=os.environ['pkg_sha']
          d['releases']=[r for r in d.get('releases',[]) if r.get('version')!=v]
          d['releases'].insert(0,{
            'version':v,
            'url':'https://raw.githubusercontent.com/cschymura/kicom-update-mirror/main/releases/0.9.12/KiCom-0.9.12-Session-TOTP-Grace.zip',
            'sha256':sha,
            'published_at':datetime.now(timezone.utc).isoformat()
          })
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('source/0.9.12/SOURCE-SNAPSHOT.json').write_text(json.dumps({
            'schema':1,'product':'kicom','version':v,'release_sha256':sha,
            'source_of_truth':'releases/0.9.12/KiCom-0.9.12-Session-TOTP-Grace.zip',
            'runtime_state_removed':True,
            'policy':'immutable release-derived install/update source snapshot',
            'github_role':'optional external mirror/fallback transport only; KiCom remains authority'
          },indent=2)+'\n')
          PY
            result=success; stage=complete
          fi
          export result stage rc risk pkg_sha
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          Path('build/status/0.9.12.json').write_text(json.dumps({
            'schema':1,'product':'kicom','version':'0.9.12',
            'result':os.environ['result'],'stage':os.environ['stage'],
            'exit_code':int(os.environ['rc']),'risk':os.environ['risk'],
            'package_sha256':os.environ['pkg_sha'],
            'updated_at':datetime.now(timezone.utc).isoformat(),
            'transport_role':'optional mirror build transport; package verified by 0.9.11 verifier and regression suite'
          },indent=2)+'\n')
          PY
          git config user.name 'kicom-build-bot'
          git config user.email 'kicom-build-bot@users.noreply.github.com'
          git add build/status/0.9.12.json build/status/0.9.12.log
          if [ "$result" = success ]; then
            git add releases/0.9.12 source/0.9.12 channel.json
          fi
          git commit -m "KiCom 0.9.12 build result: $result" || true
          git push
          exit "$rc"
