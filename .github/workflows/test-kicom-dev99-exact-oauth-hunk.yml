    branches:
      - work/kicom-engram-dev99-oauth-exact-hunk
    paths:
      - 'development/0.9.27/engram/dev93/NATIVE-original-oauth-write-consent.patch'
      - 'development/0.9.27/engram/dev99/**'
      - '.github/workflows/test-kicom-dev99-exact-oauth-hunk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-oauth-hunk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject new scope branch misclassified as original context
        run: |
          set -euo pipefail
          python3 -m py_compile development/0.9.27/engram/dev99/test_dev93_exchange_diff.py
          python3 development/0.9.27/engram/dev99/test_dev93_exchange_diff.py
