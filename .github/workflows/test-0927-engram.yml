name: KiCom private Engram DEV
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/**'
      - '.github/workflows/test-0927-engram.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-engram:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,sodium
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline-workstation cryptography test dependency
        run: python3 -m pip install --disable-pip-version-check 'PyNaCl==1.5.0'
      - name: Verify original R3 source and exact package untouched
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint and execute synthetic private-store and negative-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          php -l development/0.9.27/engram/KiComEngramStore.php
          php -l development/0.9.27/engram/test-engram.php
          php -l development/0.9.27/engram/KiComEngramSyntheticTransfer.php
          php -l development/0.9.27/engram/test-engram-offline-transfer.php
          python3 -m py_compile development/0.9.27/engram/engram_local_offline.py
          php development/0.9.27/engram/test-engram.php
      - name: Build NON-installable operator review archive (public source + synthetic tests only)
        shell: bash
        run: |
          set -euo pipefail
          bash development/0.9.27/engram/make-review-package.sh "$GITHUB_WORKSPACE/Engram-Hostprobe-REVIEW-DEV.zip"
          unzip -l "$GITHUB_WORKSPACE/Engram-Hostprobe-REVIEW-DEV.zip"
          sha256sum "$GITHUB_WORKSPACE/Engram-Hostprobe-REVIEW-DEV.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Engram-Hostprobe-REVIEW-DEV
          path: Engram-Hostprobe-REVIEW-DEV.zip
          if-no-files-found: error
          retention-days: 14
