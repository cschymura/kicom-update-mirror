name: Build KiCom mirror release

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-093:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'BUILD_KICOM_0.9.3_FEED_DIAGNOSTICS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reassemble trusted 0.9.2 R2 base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(tr -d '\r\n ' < payload/EXPECTED_SHA256)"
          cat payload/part-0??.b64 | tr -d '\r\n' | base64 --decode > /tmp/KiCom-0.9.2-R2.zip
          ACTUAL="$(sha256sum /tmp/KiCom-0.9.2-R2.zip | awk '{print $1}')"
          echo "Reconstructed base SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "b46cd8205449d98b5dd048f995cdb88da05a1443f81b7027e6d24da40024b1fd"
      - name: Build 0.9.3 feed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_093_feed_diagnostics.py /tmp/KiCom-0.9.2-R2.zip /tmp/KiCom-0.9.3-Feed-Diagnostics.zip
          rm -rf /tmp/kicom-lint && mkdir /tmp/kicom-lint
          unzip -q /tmp/KiCom-0.9.3-Feed-Diagnostics.zip -d /tmp/kicom-lint
          php -l /tmp/kicom-lint/lib.php
          php -l /tmp/kicom-lint/admin.php
          php -l /tmp/kicom-lint/index.php
          php -l /tmp/kicom-lint/api.php
          mkdir -p releases/0.9.3
          mv /tmp/KiCom-0.9.3-Feed-Diagnostics.zip releases/0.9.3/KiCom-0.9.3-Feed-Diagnostics.zip
      - name: Publish feed entry
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum releases/0.9.3/KiCom-0.9.3-Feed-Diagnostics.zip | awk '{print $1}')"
          export SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('channel.json')
          d=json.loads(p.read_text())
          releases=[r for r in d.get('releases',[]) if r.get('version')!='0.9.3']
          releases.insert(0,{
            'version':'0.9.3',
            'url':'https://raw.githubusercontent.com/cschymura/kicom-update-mirror/main/releases/0.9.3/KiCom-0.9.3-Feed-Diagnostics.zip',
            'sha256':os.environ['SHA'],
            'published_at':'2026-09-15T04:15:00+02:00'
          })
          d['schema']=1; d['product']='kicom'; d['releases']=releases
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'kicom-mirror-bot'
          git config user.email 'kicom-mirror-bot@users.noreply.github.com'
          git add releases/0.9.3/KiCom-0.9.3-Feed-Diagnostics.zip channel.json
          git commit -m 'Publish KiCom 0.9.3 feed diagnostics'
          git push

  build-094:
    if: github.event_name == 'issues' && github.event.issue.title == 'BUILD_KICOM_0.9.4_AUTONOMOUS_EVOLUTION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact installed 0.9.3 mirror base
        shell: bash
        run: |
          set -euo pipefail
          BASE='releases/0.9.3/KiCom-0.9.3-Feed-Diagnostics.zip'
          test -f "$BASE"
          test "$(sha256sum "$BASE" | awk '{print $1}')" = '7bc33a5b5188548ea3d3b15065b5de6de38282b18cf24d141f9ec4ec6a958031'
          rm -rf /tmp/kicom094 /tmp/kicom093-inspect
          mkdir -p /tmp/kicom094 /tmp/kicom093-inspect
          unzip -q "$BASE" -d /tmp/kicom094
          unzip -q "$BASE" -d /tmp/kicom093-inspect
          test "$(sha256sum /tmp/kicom094/README.md | awk '{print $1}')" = '7aea7625e5cdaf660516ee2dc3f605a2ec854c188670c800a4bc3138e9052b55'
          test "$(sha256sum /tmp/kicom094/admin.php | awk '{print $1}')" = 'bfc0c6a9cb5c8f86dcfcdfc85bb26c7d4a75789775cb23cf8b763681a7a23b20'
          test "$(sha256sum /tmp/kicom094/lib.php | awk '{print $1}')" = '0f432ed352ec3fe680eca4fd83161953a3d69118d163aa3abee23728cb5fa366'
          test "$(sha256sum /tmp/kicom094/living.php | awk '{print $1}')" = 'fe13e73770713d2d37e018477f50259271d876b9bb726312172acaafcaaa1743'
          test "$(sha256sum /tmp/kicom094/genome/genome.json | awk '{print $1}')" = '3607317fb23e82f70997a14b8b94778b68a00c45a0890cbdc211410b462f4bd7'
      - name: Apply reviewed autonomous evolution patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build/0.9.4/core.patch.gz.b64 | gzip --decompress > /tmp/kicom094.patch
          test "$(sha256sum /tmp/kicom094.patch | awk '{print $1}')" = 'f99b58d76776c9d4106eb2c655efd6f2242ca7e7aac6c44d152bf4605df38a4a'
          patch -p1 -d /tmp/kicom094 < /tmp/kicom094.patch
          find /tmp/kicom094/var -mindepth 1 ! -name .htaccess -exec rm -rf {} +
          find /tmp/kicom094/stage -mindepth 1 ! -name .htaccess -exec rm -rf {} +
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('/tmp/kicom094')
          g=json.loads((root/'genome/genome.json').read_text())
          assert g['id']=='kicom-0.9.4-g5' and g['version']=='0.9.4' and g['parent']=='kicom-0.9.3-g4' and g['generation']==5
          for c in g['components']:
              p=root/c['path']
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==c['sha256'], (c['path'],actual,c['sha256'])
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel=='MANIFEST.sha256': continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
          (root/'MANIFEST.sha256').write_text(''.join(rows))
          PY
          php -l /tmp/kicom094/lib.php
          php -l /tmp/kicom094/living.php
          php -l /tmp/kicom094/admin.php
          php -l /tmp/kicom094/index.php
          php -l /tmp/kicom094/api.php
      - name: Package and inspect as a 0.9.3 upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip
          (cd /tmp/kicom094 && zip -q -r /tmp/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip .)
          PACKAGE='/tmp/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip'
          PACKAGE="$PACKAGE" php -r '
            $p=getenv("PACKAGE"); require "/tmp/kicom093-inspect/lib.php";
            $x=kicomSelfUpdateZipInspect($p);
            if(empty($x["ok"])){fwrite(STDERR,"inspect ".($x["code"]??"UNKNOWN")."\n");exit(1);}
            $r=kicomSelfUpdateRiskClass($x);
            if(($x["version"]??"")!=="0.9.4"||($x["genome"]["id"]??"")!=="kicom-0.9.4-g5"||($r["class"]??"")!=="yellow"){
              fwrite(STDERR,json_encode([$x["version"]??null,$x["genome"]["id"]??null,$r])."\n");exit(1);
            }
            echo "INSPECT_OK version=0.9.4 risk=yellow\n";
          '
          mkdir -p releases/0.9.4
          mv "$PACKAGE" releases/0.9.4/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip
      - name: Publish 0.9.4 mirror feed entry
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum releases/0.9.4/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip | awk '{print $1}')"
          export SHA
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('channel.json'); d=json.loads(p.read_text())
          releases=[r for r in d.get('releases',[]) if r.get('version')!='0.9.4']
          releases.insert(0,{
            'version':'0.9.4',
            'url':'https://raw.githubusercontent.com/cschymura/kicom-update-mirror/main/releases/0.9.4/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip',
            'sha256':os.environ['SHA'],
            'published_at':datetime.now(timezone.utc).isoformat()
          })
          d['schema']=1; d['product']='kicom'; d['releases']=releases
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'kicom-mirror-bot'
          git config user.email 'kicom-mirror-bot@users.noreply.github.com'
          git add releases/0.9.4/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip channel.json
          git commit -m 'Publish KiCom 0.9.4 autonomous evolution epochs'
          git push
