name: KiCom Engram signed owner activation and OAuth MCP
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramSignedOwnerActivation.php'
      - 'development/0.9.27/engram/test-engram-signed-owner-activation.php'
      - '.github/workflows/test-0927-engram-signed-owner-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-owner-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl,sodium
          coverage: none
      - name: Verify immutable original KiCom PasskeyBridge and release baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
          test "$(git hash-object source/0.9.26-r3/modules/dev/PasskeyBridge.php)" = "57023a0681702cf63cefe1f75dc71b0eed7e2cb7"
      - name: Lint owner activation and run original signed-WebAuthn to private SQLite activation
        shell: bash
        run: |
          set -euo pipefail
          for file in KiComEngramSignedOwnerActivation.php KiComEngramActivationTransaction.php KiComEngramActivationReadinessGate.php KiComEngramSharedHostAdminConfig.php KiComEngramOAuthHttp.php test-engram-signed-owner-activation.php; do
            php -l "development/0.9.27/engram/$file"
          done
          php development/0.9.27/engram/test-engram-signed-owner-activation.php
