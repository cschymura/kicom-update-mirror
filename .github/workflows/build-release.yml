name: Build KiCom mirror release

on:
  push:
    paths:
      - 'payload/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified package
        shell: bash
        run: |
          set -euo pipefail
          test -f payload/EXPECTED_SHA256
          EXPECTED="$(tr -d '\r\n ' < payload/EXPECTED_SHA256)"
          cat payload/part-*.b64 | tr -d '\r\n' | base64 --decode > KiCom-0.9.2-R2.zip
          ACTUAL="$(sha256sum KiCom-0.9.2-R2.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p releases/0.9.2
          mv KiCom-0.9.2-R2.zip releases/0.9.2/KiCom-0.9.2-R2.zip
      - name: Commit binary mirror artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kicom-mirror-bot'
          git config user.email 'kicom-mirror-bot@users.noreply.github.com'
          git add releases/0.9.2/KiCom-0.9.2-R2.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build verified KiCom 0.9.2 R2 mirror artifact'
          git push
