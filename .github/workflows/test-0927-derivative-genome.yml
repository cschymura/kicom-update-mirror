name: KiCom derivative genome integration
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/reproduction/**'
      - 'development/0.9.27/membrane/test-os-boundary.sh'
      - 'source/0.9.26-r3/**'
      - '.github/workflows/test-0927-derivative-genome.yml'
permissions:
  contents: read
jobs:
  derivative-genome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, sodium
          coverage: none
      - name: Verify unchanged R3 source and package
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Test signed derivative genome binding
        shell: bash
        run: |
          set -euo pipefail
          php -l development/0.9.27/reproduction/KiComDerivativeGenome.php
          php -l development/0.9.27/reproduction/test-derivative-genome.php
          php development/0.9.27/reproduction/test-derivative-genome.php
      - name: Exercise actual isolated KCL GENOME_STATUS
        shell: bash
        run: |
          set -euo pipefail
          bash development/0.9.27/reproduction/test-derivative-runtime.sh
      - name: Re-run existing reproduction quarantine tests with required OS fixture
        shell: bash
        run: |
          set -euo pipefail
          php development/0.9.27/reproduction/test-child-lineage.php
          php development/0.9.27/reproduction/test-child-birth-gate.php
          # The OS-backed quarantine scripts are intentionally stateful and must
          # run in the same prerequisite order as the canonical membrane suite.
          bash development/0.9.27/membrane/test-os-boundary.sh
          bash development/0.9.27/reproduction/test-isolated-identity.sh
          bash development/0.9.27/reproduction/test-daughter-runtime.sh
          bash development/0.9.27/reproduction/test-child-host-lineage.sh
          bash development/0.9.27/reproduction/test-daughter-recovery.sh
          php development/0.9.27/reproduction/test-real-native-birth.php /tmp/kicom-membrane-os-$GITHUB_RUN_ID
