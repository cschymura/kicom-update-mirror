name: KiCom 0.9.27 PAM isolated tests

on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/pam/**'
      - '!development/0.9.27/pam/status/**'
      - '.github/workflows/test-0927-pam.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kicom-0927-pam-tests
  cancel-in-progress: false

jobs:
  pam:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/kicom-0.9.27-pam
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Lint and run isolated tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          php -l development/0.9.27/pam/KiComPam.php
          php -l development/0.9.27/pam/test.php
          php development/0.9.27/pam/test.php | tee /tmp/pam-test-log.txt
      - name: Persist CI result without touching live KiCom
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p development/0.9.27/pam/status
          printf 'CI_RESULT=%s\nRUN_ID=%s\nTRIGGER_SHA=%s\n' "$TEST_RESULT" "$GITHUB_RUN_ID" "$GITHUB_SHA" > development/0.9.27/pam/status/latest-ci.txt
          if [ -s /tmp/pam-test-log.txt ]; then
            tail -n 32 /tmp/pam-test-log.txt >> development/0.9.27/pam/status/latest-ci.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/0.9.27/pam/status/latest-ci.txt
          git diff --cached --quiet || (git commit -m 'Record isolated PAM CI outcome [skip ci]' && git push origin HEAD:work/kicom-0.9.27-pam)
