name: KiCom private Engram DEV
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/**'
      - '.github/workflows/test-0927-engram.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-engram:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,sodium,zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline-workstation cryptography test dependency
        run: python3 -m pip install --disable-pip-version-check 'PyNaCl==1.5.0'
      - name: Verify original R3 source and exact package untouched
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint and execute synthetic private-store and negative-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          node --check development/0.9.27/engram/engram-review-client.js
          php -l development/0.9.27/engram/KiComEngramStore.php
          php -l development/0.9.27/engram/test-engram.php
          php -l development/0.9.27/engram/KiComEngramSyntheticTransfer.php
          php -l development/0.9.27/engram/test-engram-offline-transfer.php
          python3 -m py_compile development/0.9.27/engram/engram_local_offline.py
          php development/0.9.27/engram/test-engram.php
      - name: Build NON-installable operator review archive (public source + synthetic tests only)
        shell: bash
        run: |
          set -euo pipefail
          bash development/0.9.27/engram/make-review-package.sh "$GITHUB_WORKSPACE/Engram-Hostprobe-REVIEW-DEV.zip"
          unzip -l "$GITHUB_WORKSPACE/Engram-Hostprobe-REVIEW-DEV.zip"
          sha256sum "$GITHUB_WORKSPACE/Engram-Hostprobe-REVIEW-DEV.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Engram-Hostprobe-REVIEW-DEV
          path: Engram-Hostprobe-REVIEW-DEV.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build disabled 0.9.27 Engram host-probe CANDIDATE from exact verified R3
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/KiCom-0.9.27-Engram-Hostprobe-REVIEW-ONLY.zip"
          python3 development/0.9.27/engram/build_staging_host_probe.py "$OUT"
          test -s "$OUT"
          php -l development/0.9.27/engram/KiComEngramDevCandidatePatcher.php
          unzip -tqq "$OUT"
          sha256sum "$OUT"
          mkdir -p /tmp/kicom-engram-r3-review
          cp -a source/0.9.26-r3/. /tmp/kicom-engram-r3-review/
          php -d display_errors=0 -r '
            chdir($argv[1]);
            require "lib.php";
            $x=kicomSelfUpdateZipInspect($argv[2]);
            if(empty($x["ok"])){
              fwrite(STDERR,"ENGRAM_REVIEW_VERIFIER_DENIED=".($x["code"]??"UNKNOWN")."\n");
              exit(71);
            }
            if(($x["version"]??"")!=="0.9.27"
              || ($x["genome"]["id"]??"")!=="kicom-0.9.27-g26-engram-probe"
              || ($x["genome"]["parent"]??"")!=="kicom-0.9.26-g25r3"
              || (int)($x["genome"]["generation"]??0)!==26
              || !empty($x["kernel_update"])
              || ($x["genome"]["mutation_reason"]??"")!=="isolated-dev-engram-synthetic-path-probe-inert-until-trusted-config")exit(72);
            $risk=kicomSelfUpdateRiskClass($x);
            if(($risk["class"]??"")!=="red")exit(73);
            foreach(["recovery.php","index.php","api.php","guardian.php",".htaccess"] as $critical){
              $original=hash_file("sha256",$argv[1]."/".$critical);
              $candidate=$x["entries"][$critical]["sha256"]??"";
              if(!hash_equals($original,$candidate))exit(74);
            }
            if(isset($x["entries"]["modules/dev/EngramPrivateUserMemory.php"]))exit(75);
            foreach(array_keys($x["entries"]) as $p){
              if(str_starts_with($p,"var/")&&$p!=="var/.htaccess")exit(76);
            }
            echo "ENGRAM_STAGING_REVIEW_VERIFIER_OK=1\n";
            echo "ENGRAM_STAGING_REVIEW_RISK=red\n";
            echo "ENGRAM_STAGING_REVIEW_KERNEL_UNCHANGED=1\n";
            echo "ENGRAM_STAGING_REVIEW_PRIVATE_CONFIG_INCLUDED=0\n";
            echo "ENGRAM_STAGING_REVIEW_INSTALL_ATTEMPTED=0\n";
          ' /tmp/kicom-engram-r3-review "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: KiCom-0927-Engram-Hostprobe-REVIEW-ONLY
          path: KiCom-0.9.27-Engram-Hostprobe-REVIEW-ONLY.zip
          if-no-files-found: error
          retention-days: 14
