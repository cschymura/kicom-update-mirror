name: KiCom Mail Channel v1

on:
  push:
    branches: [ candidate/expansion-cell-v1 ]
    paths:
      - 'experimental/mail-channel/**'
      - 'candidates/mail-channel-v1/**'
      - '.github/workflows/mail-channel-v1.yml'
  pull_request:
    paths:
      - 'experimental/mail-channel/**'
      - 'candidates/mail-channel-v1/**'
      - '.github/workflows/mail-channel-v1.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l experimental/mail-channel/KiComMailChannel.php
      - name: Mail channel selftest
        run: php experimental/mail-channel/mail-channel-selftest.php
      - name: Assert credential is reference-only
        shell: bash
        run: |
          jq -e '
            .credentials.password_source == "KICOM_MAIL_PASSWORD"
            and (.credentials | has("password") | not)
            and .credentials.repository_storage == "FORBIDDEN"
            and .credentials.memory_storage == "FORBIDDEN"
            and .credentials.log_storage == "FORBIDDEN"
          ' candidates/mail-channel-v1/MAIL_ACCOUNT.json >/dev/null
