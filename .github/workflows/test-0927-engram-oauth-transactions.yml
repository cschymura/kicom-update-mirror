name: KiCom Engram OAuth PKCE transaction tests
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramOAuthTransactions.php'
      - 'development/0.9.27/engram/test-engram-oauth-transactions.php'
      - '.github/workflows/test-0927-engram-oauth-transactions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl
          coverage: none
      - name: Verify original KiCom immutable release and source
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint and exercise OAuth PKCE access-token issuance and denials
        shell: bash
        run: |
          set -euo pipefail
          php -l development/0.9.27/engram/KiComEngramOAuthTransactions.php
          php -l development/0.9.27/engram/test-engram-oauth-transactions.php
          php development/0.9.27/engram/test-engram-oauth-transactions.php
