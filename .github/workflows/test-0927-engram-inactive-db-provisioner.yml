name: KiCom Engram inactive private database provisioning
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramInactiveDbProvisioner.php'
      - 'development/0.9.27/engram/test-engram-inactive-db-provisioner.php'
      - '.github/workflows/test-0927-engram-inactive-db-provisioner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl
          coverage: none
      - name: Verify immutable original KiCom release and source
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint private staging and execute original-data-preservation tests
        shell: bash
        run: |
          set -euo pipefail
          for f in KiComEngramInactiveDbProvisioner.php KiComEngramOAuthTransactions.php KiComEngramActivationTransaction.php KiComEngramActivationReadinessGate.php test-engram-inactive-db-provisioner.php; do
            php -l "development/0.9.27/engram/$f"
          done
          php development/0.9.27/engram/test-engram-inactive-db-provisioner.php
