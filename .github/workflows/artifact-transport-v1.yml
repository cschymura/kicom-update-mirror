name: KiCom Artifact Transport v1

on:
  pull_request:
    paths:
      - 'experimental/artifact-transport/**'
      - '.github/workflows/artifact-transport-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PHP syntax
        run: |
          php -l experimental/artifact-transport/ArtifactTransportBus.php
          php -l experimental/artifact-transport/ArtifactFtpAdapter.php
          php -l experimental/artifact-transport/artifact-transport-selftest.php

      - name: Static authority boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '\b(exec|shell_exec|system|passthru|proc_open|popen)\s*\(' experimental/artifact-transport; then
            echo 'Artifact transport must not execute shell commands' >&2
            exit 1
          fi
          if grep -RniE 'kicomApplySelfUpdate|kicomSelfUpdateInstall|production\.write|kernel\.write|recovery\.write|secrets\.read' experimental/artifact-transport/ArtifactTransportBus.php; then
            echo 'Transport bus must not own production install authority' >&2
            exit 1
          fi
          grep -q "authority.*transport-only" experimental/artifact-transport/ArtifactTransportBus.php
          grep -q "production_tree_write.*false" experimental/artifact-transport/ArtifactTransportBus.php
          grep -q "sha256_required.*true" experimental/artifact-transport/ArtifactTransportBus.php
          grep -q "history.*append-only" experimental/artifact-transport/ArtifactTransportBus.php
          grep -q "PLAINTEXT_FTP_FORBIDDEN" experimental/artifact-transport/ArtifactFtpAdapter.php
          grep -q '"type": "manual-upload"' experimental/artifact-transport/sources.example.json
          grep -q '"type": "recovery"' experimental/artifact-transport/sources.example.json
          if grep -nE '"(username|password|token|secret)"\s*:' experimental/artifact-transport/sources.example.json; then
            echo 'Source blueprint must not contain credentials' >&2
            exit 1
          fi

      - name: Multi-transport selftest
        run: php experimental/artifact-transport/artifact-transport-selftest.php

      - name: Build candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/artifact-transport-v1
          mkdir -p dist/artifact-transport-v1
          cp experimental/artifact-transport/ArtifactTransportBus.php dist/artifact-transport-v1/
          cp experimental/artifact-transport/ArtifactFtpAdapter.php dist/artifact-transport-v1/
          cp experimental/artifact-transport/sources.example.json dist/artifact-transport-v1/
          cp experimental/artifact-transport/README.md dist/artifact-transport-v1/
          (cd dist && zip -qr kicom-artifact-transport-v1.zip artifact-transport-v1)
          sha256sum dist/kicom-artifact-transport-v1.zip | tee dist/kicom-artifact-transport-v1.zip.sha256

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: kicom-artifact-transport-v1
          path: |
            dist/kicom-artifact-transport-v1.zip
            dist/kicom-artifact-transport-v1.zip.sha256
          if-no-files-found: error
          retention-days: 14
