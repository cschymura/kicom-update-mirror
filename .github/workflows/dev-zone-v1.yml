name: KiCom DEV zone checks

on:
  pull_request:
    paths:
      - 'experimental/dev-zone/**'
      - 'experimental/passkey-auth/**'
      - '.github/workflows/dev-zone-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PHP CLI
        shell: bash
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-common php-zip zip
          fi
          php -v

      - name: Require crypto extensions
        run: >-
          php -r '$missing=[]; foreach (["openssl","sodium","zip"] as $e) if (!extension_loaded($e)) $missing[]=$e;
          if ($missing) { fwrite(STDERR,"Missing extensions: ".implode(",",$missing)."\n"); exit(1); }
          echo "openssl+sodium+zip available\n";'

      - name: PHP syntax
        run: |
          php -l experimental/passkey-auth/PasskeyBridge.php
          php -l experimental/dev-zone/DevSession.php
          php -l experimental/dev-zone/DevAuthAdapter.php
          php -l experimental/dev-zone/DevAuthFlow.php
          php -l experimental/dev-zone/DevRouter.php
          php -l experimental/dev-zone/DevHttpAdapter.php
          php -l experimental/dev-zone/DevKiComBindings.php
          php -l experimental/dev-zone/DevDiagnostics.php
          php -l experimental/dev-zone/runtime/dev-auth.php
          php -l experimental/dev-zone/runtime/dev-api.php
          php -l experimental/dev-zone/runtime/dev-bridge.php
          php -l experimental/dev-zone/dev-selftest.php
          php -l experimental/dev-zone/dev-router-selftest.php
          php -l experimental/dev-zone/dev-http-selftest.php
          php -l experimental/dev-zone/dev-bindings-selftest.php
          php -l experimental/dev-zone/dev-diagnostics-selftest.php

      - name: Validate candidate manifest
        run: |
          php -r '$j=json_decode(file_get_contents("experimental/dev-zone/manifest.json"),true); if(!is_array($j)||($j["schema"]??0)!==1||($j["status"]??"")!=="candidate"||(($j["candidate_export"]["creates_production_pending"]??true)!==false)||($j["install_root"]??"")!=="dev/"||($j["runtime"]["agent_bridge"]??"")!=="dev/dev-bridge.php") exit(1); echo "manifest ok\n";'

      - name: DEV boundary static checks
        shell: bash
        run: |
          if grep -RniE '\b(exec|shell_exec|system|passthru|proc_open|popen)\s*\(' experimental/dev-zone; then
            echo 'Forbidden shell primitive in DEV zone' >&2
            exit 1
          fi
          if grep -RniE '\b(curl_init|fsockopen|pfsockopen)\s*\(' experimental/dev-zone; then
            echo 'Unexpected network primitive in DEV zone' >&2
            exit 1
          fi
          if grep -RniE 'production\.write|self_update\.install|kernel\.write|recovery\.write|secrets\.read' experimental/dev-zone/DevSession.php; then
            echo 'Forbidden authority literal in DEV session manager' >&2
            exit 1
          fi
          if grep -RniE '(session_id|token)=' experimental/dev-zone/dev-client.js; then
            echo 'Preferred DEV browser client must not put credentials in query strings' >&2
            exit 1
          fi
          if grep -Rni '\$_GET' experimental/dev-zone/runtime/dev-auth.php experimental/dev-zone/runtime/dev-api.php; then
            echo 'Primary DEV auth/API endpoints must not accept query-string credentials or operations' >&2
            exit 1
          fi
          grep -q "credential_scope.*dev-only" experimental/dev-zone/runtime/dev-bridge.php
          grep -q "DEV_OPERATION_FORBIDDEN" experimental/dev-zone/DevRouter.php
          if grep -n 'kicomReceiveSelfUpdatePackage' experimental/dev-zone/DevKiComBindings.php; then
            echo 'DEV candidate export must not enter the self-update pending/install pipeline' >&2
            exit 1
          fi
          grep -q 'withSessionLock' experimental/dev-zone/DevSession.php
          grep -A18 'public function revoke' experimental/dev-zone/DevSession.php | grep -q 'withSessionLock'
          grep -q "DEV_LOG_STREAM_FORBIDDEN" experimental/dev-zone/DevDiagnostics.php

      - name: DEV session and passkey selftest
        run: php experimental/dev-zone/dev-selftest.php

      - name: DEV router boundary selftest
        run: php experimental/dev-zone/dev-router-selftest.php

      - name: DEV HTTP adapter selftest
        run: php experimental/dev-zone/dev-http-selftest.php

      - name: KiCom runtime binding selftest
        run: php experimental/dev-zone/dev-bindings-selftest.php

      - name: DEV diagnostics selftest
        run: php experimental/dev-zone/dev-diagnostics-selftest.php

      - name: Build install-oriented candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/kicom-dev-zone-v1/dev
          cp experimental/passkey-auth/PasskeyBridge.php dist/kicom-dev-zone-v1/dev/
          cp experimental/passkey-auth/browser.js dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevSession.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevAuthAdapter.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevAuthFlow.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevRouter.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevHttpAdapter.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevKiComBindings.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevDiagnostics.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/dev-client.js dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-auth.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-api.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-bridge.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/index.html dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/manifest.json dist/kicom-dev-zone-v1/
          cp experimental/dev-zone/README.md dist/kicom-dev-zone-v1/
          php -l dist/kicom-dev-zone-v1/dev/DevAuthAdapter.php
          php -l dist/kicom-dev-zone-v1/dev/DevAuthFlow.php
          php -l dist/kicom-dev-zone-v1/dev/DevDiagnostics.php
          php -l dist/kicom-dev-zone-v1/dev/dev-auth.php
          php -l dist/kicom-dev-zone-v1/dev/dev-api.php
          php -l dist/kicom-dev-zone-v1/dev/dev-bridge.php
          (cd dist && zip -qr kicom-dev-zone-v1.zip kicom-dev-zone-v1)
          sha256sum dist/kicom-dev-zone-v1.zip | tee dist/kicom-dev-zone-v1.zip.sha256

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: kicom-dev-zone-v1
          path: |
            dist/kicom-dev-zone-v1.zip
            dist/kicom-dev-zone-v1.zip.sha256
          if-no-files-found: error
          retention-days: 14
