name: Build KiCom 0.9.5 Goal Memory R2

on:
  push:
    paths:
      - '.github/triggers/build-095-r2.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build verify publish and persist report
        shell: bash
        run: |
          set +e
          BASE='releases/0.9.4/KiCom-0.9.4-Autonomous-Evolution-Epochs.zip'
          PKG='/tmp/KiCom-0.9.5-Goal-Layer-Memory-Archive.zip'
          LOG='/tmp/kicom095-r2.log'
          STATUS='build/status/0.9.5.json'
          mkdir -p build/status
          : > "$LOG"
          fail=0; failed_stage=''; risk='unknown'; pkg_sha=''

          run_stage(){
            local name="$1"; shift
            echo "== $name ==" >>"$LOG"
            "$@" >>"$LOG" 2>&1
            local rc=$?
            if [ $rc -ne 0 ]; then fail=$rc; failed_stage="$name"; echo "FAILED stage=$name rc=$rc" >>"$LOG"; fi
            return $rc
          }

          if [ ! -f "$BASE" ]; then fail=1; failed_stage='base'; echo BASE_MISSING >>"$LOG"; fi
          if [ $fail -eq 0 ]; then
            bsha="$(sha256sum "$BASE" | awk '{print $1}')"; echo "base_sha256=$bsha" >>"$LOG"
            if [ "$bsha" != '88fa2502ff473f1477c16a215e99b1f36e2d7f57fb1f71adf5e4af2ebc158a58' ]; then fail=2; failed_stage='base'; echo BASE_SHA_MISMATCH >>"$LOG"; fi
          fi

          if [ $fail -eq 0 ]; then run_stage builder python tools/build_095_goal_memory_allowlisted.py "$BASE" "$PKG"; fi
          ROOT='/tmp/kicom095-goal-memory'
          if [ $fail -eq 0 ]; then
            echo '== syntax ==' >>"$LOG"
            for f in lib.php living.php index.php api.php admin.php guardian.php recovery.php; do
              php -l "$ROOT/$f" >>"$LOG" 2>&1 || { fail=$?; failed_stage="syntax:$f"; break; }
            done
          fi

          if [ $fail -eq 0 ]; then
            echo '== package path policy ==' >>"$LOG"
            if unzip -Z1 "$PKG" | grep -qx 'goals_memory.php'; then fail=41; failed_stage='allowlist'; echo UNEXPECTED_ROOT_EXECUTABLE >>"$LOG"; fi
          fi

          if [ $fail -eq 0 ]; then
            echo '== fresh install ==' >>"$LOG"
            rm -rf /tmp/kicom095-fresh && mkdir -p /tmp/kicom095-fresh && unzip -q "$PKG" -d /tmp/kicom095-fresh
            php -r 'require "/tmp/kicom095-fresh/lib.php"; if(KICOM_VERSION!=="0.9.5")exit(11); if(!kicomEnsureStorage())exit(12); $s=kicomLivingStatus(); if(empty($s["trusted"])||empty($s["lkg_ok"]))exit(13); $g=kicomGoals(true);$m=kicomMemoryArchiveStatus(); if(($g["policy"]??"")!=="archive-never-hard-delete"||($m["policy"]??"")!=="archive-never-hard-delete")exit(14); echo "FRESH_INSTALL_OK\n";' >>"$LOG" 2>&1
            rc=$?; if [ $rc -ne 0 ]; then fail=$rc; failed_stage='fresh-install'; fi
          fi

          if [ $fail -eq 0 ]; then
            echo '== functional ==' >>"$LOG"
            php -r 'require "/tmp/kicom095-fresh/lib.php"; $g=kicomGoalUpsert("human","Test goal","Verify persistent goal semantics","low","CI","Goal remains permissionless","ci:test",true); if(empty($g["ok"]))exit(21); $raw=json_encode(["schema"=>1,"kind"=>"full_snapshot","memory"=>["test"=>"ci"],"goal_hypotheses"=>[["title"=>"Memory-derived CI goal","description"=>"Verify approved memory can create a goal hypothesis","priority"=>"low","success_criteria"=>"Goal exists"]]],JSON_UNESCAPED_SLASHES);$m=kicomMemoryArchiveSnapshotStore($raw,"chatgpt_memory","CI snapshot");if(empty($m["ok"])||count($m["goals_ingested"]??[])!==1)exit(22);echo "GOAL_MEMORY_FUNCTIONAL_OK\n";' >>"$LOG" 2>&1
            rc=$?; if [ $rc -ne 0 ]; then fail=$rc; failed_stage='functional'; fi
          fi

          if [ $fail -eq 0 ]; then
            echo '== exact 0.9.4 verifier ==' >>"$LOG"
            rm -rf /tmp/kicom094-verifier && mkdir -p /tmp/kicom094-verifier && unzip -q "$BASE" -d /tmp/kicom094-verifier
            PACKAGE="$PKG" php -r '$p=getenv("PACKAGE");require "/tmp/kicom094-verifier/lib.php";$x=kicomSelfUpdateZipInspect($p);if(empty($x["ok"])){echo "INSPECT_CODE=".($x["code"]??"UNKNOWN")." PATH=".($x["path"]??"")."\n";exit(31);} $r=kicomSelfUpdateRiskClass($x);$c=(string)($r["class"]??"red");echo "RISK=$c\nREASONS=".json_encode($r["reasons"]??[])."\n";if(($x["version"]??"")!=="0.9.5"||($x["genome"]["id"]??"")!=="kicom-0.9.5-g6")exit(32);if($c==="green")exit(33);' >>"$LOG" 2>&1
            rc=$?; if [ $rc -ne 0 ]; then fail=$rc; failed_stage='verifier'; else risk="$(grep '^RISK=' "$LOG"|tail -1|cut -d= -f2)"; fi
          fi

          if [ $fail -eq 0 ]; then
            echo '== publish ==' >>"$LOG"
            pkg_sha="$(sha256sum "$PKG"|awk '{print $1}')"; export pkg_sha
            mkdir -p releases/0.9.5 source/0.9.5 /tmp/kicom095-source
            cp "$PKG" releases/0.9.5/KiCom-0.9.5-Goal-Layer-Memory-Archive.zip
            rm -rf source/0.9.5 /tmp/kicom095-source; mkdir -p source/0.9.5 /tmp/kicom095-source
            unzip -q "$PKG" -d /tmp/kicom095-source
            find /tmp/kicom095-source/var -mindepth 1 ! -name .htaccess -exec rm -rf {} + 2>/dev/null || true
            find /tmp/kicom095-source/stage -mindepth 1 ! -name .htaccess -exec rm -rf {} + 2>/dev/null || true
            cp -a /tmp/kicom095-source/. source/0.9.5/
            python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          sha=os.environ['pkg_sha']
          Path('source/0.9.5/SOURCE-SNAPSHOT.json').write_text(json.dumps({'schema':1,'product':'kicom','version':'0.9.5','release_sha256':sha,'source_of_truth':'releases/0.9.5/KiCom-0.9.5-Goal-Layer-Memory-Archive.zip','runtime_state_removed':True,'policy':'immutable release-derived source snapshot'},indent=2)+'\n')
          p=Path('channel.json');d=json.loads(p.read_text());d['releases']=[r for r in d.get('releases',[]) if r.get('version')!='0.9.5'];d['releases'].insert(0,{'version':'0.9.5','url':'https://raw.githubusercontent.com/cschymura/kicom-update-mirror/main/releases/0.9.5/KiCom-0.9.5-Goal-Layer-Memory-Archive.zip','sha256':sha,'published_at':datetime.now(timezone.utc).isoformat()});p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          fi

          if [ $fail -eq 0 ]; then result='success'; failed_stage='complete'; else result='failed'; fi
          export result failed_stage fail risk pkg_sha
          tail -c 60000 "$LOG" > build/status/0.9.5.log
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          Path('build/status/0.9.5.json').write_text(json.dumps({'schema':1,'product':'kicom','version':'0.9.5','result':os.environ['result'],'stage':os.environ['failed_stage'],'exit_code':int(os.environ['fail']),'risk':os.environ['risk'],'package_sha256':os.environ['pkg_sha'],'updated_at':datetime.now(timezone.utc).isoformat(),'trigger':'push:.github/triggers/build-095-r2.txt','builder':'allowlist-compatible'},indent=2)+'\n')
          PY

          git config user.name 'kicom-mirror-bot'; git config user.email 'kicom-mirror-bot@users.noreply.github.com'
          git add build/status/0.9.5.json build/status/0.9.5.log
          if [ $fail -eq 0 ]; then git add releases/0.9.5 source/0.9.5 channel.json; fi
          git commit -m "KiCom 0.9.5 R2 build result: $result" || true
          git push || exit 90
          exit $fail
