name: KiCom DEV zone checks

on:
  pull_request:
    paths:
      - 'experimental/dev-zone/**'
      - 'experimental/passkey-auth/**'
      - 'experimental/expansion-cell/**'
      - '.github/workflows/dev-zone-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PHP CLI
        shell: bash
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-common php-zip zip
          fi
          php -v

      - name: Require crypto extensions
        run: >-
          php -r '$missing=[]; foreach (["openssl","sodium","zip"] as $e) if (!extension_loaded($e)) $missing[]=$e;
          if ($missing) { fwrite(STDERR,"Missing extensions: ".implode(",",$missing)."\n"); exit(1); }
          echo "openssl+sodium+zip available\n";'

      - name: PHP syntax
        run: |
          php -l experimental/passkey-auth/PasskeyBridge.php
          php -l experimental/dev-zone/DevSession.php
          php -l experimental/dev-zone/DevAuthAdapter.php
          php -l experimental/dev-zone/DevAuthFlow.php
          php -l experimental/dev-zone/DevRouter.php
          php -l experimental/dev-zone/DevHttpAdapter.php
          php -l experimental/dev-zone/DevKiComBindings.php
          php -l experimental/dev-zone/DevDiagnostics.php
          php -l experimental/dev-zone/DevObserver.php
          php -l experimental/dev-zone/DevExpansionBindings.php
          php -l experimental/dev-zone/DevSandboxPerception.php
          php -l experimental/dev-zone/runtime/dev-auth.php
          php -l experimental/dev-zone/runtime/dev-api.php
          php -l experimental/dev-zone/runtime/dev-expansion.php
          php -l experimental/dev-zone/runtime/doctor.php
          php -l experimental/dev-zone/runtime/dev-bridge.php
          php -l experimental/dev-zone/runtime/agent/index.php
          php -l experimental/dev-zone/dev-selftest.php
          php -l experimental/dev-zone/dev-router-selftest.php
          php -l experimental/dev-zone/dev-http-selftest.php
          php -l experimental/dev-zone/dev-bindings-selftest.php
          php -l experimental/dev-zone/dev-diagnostics-selftest.php
          php -l experimental/dev-zone/dev-observer-selftest.php
          php -l experimental/dev-zone/dev-expansion-selftest.php
          php -l experimental/expansion-cell/CellPerceptionAction.php
          php -l experimental/expansion-cell/CellWorldModel.php

      - name: Validate candidate manifest
        run: |
          php -r '$j=json_decode(file_get_contents("experimental/dev-zone/manifest.json"),true); if(!is_array($j)||($j["schema"]??0)!==1||($j["status"]??"")!=="candidate"||(($j["candidate_export"]["creates_production_pending"]??true)!==false)||($j["install_root"]??"")!=="dev/"||($j["runtime"]["agent_bridge"]??"")!=="dev/agent/"||($j["runtime"]["expansion_endpoint"]??"")!=="dev/dev-expansion.php"||($j["runtime"]["sandbox_expansion"]["resource_alias"]??"")!=="sandbox"||(($j["runtime"]["sandbox_expansion"]["agent_get_execute"]??true)!==false)) exit(1); echo "manifest ok\n";'

      - name: DEV boundary static checks
        shell: bash
        run: |
          if grep -RniE '\b(exec|shell_exec|system|passthru|proc_open|popen)\s*\(' experimental/dev-zone; then
            echo 'Forbidden shell primitive in DEV zone' >&2
            exit 1
          fi
          if grep -RniE '\b(curl_init|fsockopen|pfsockopen)\s*\(' experimental/dev-zone; then
            echo 'Unexpected network primitive in DEV zone' >&2
            exit 1
          fi
          if grep -RniE 'production\.write|self_update\.install|kernel\.write|recovery\.write|secrets\.read' experimental/dev-zone/DevSession.php; then
            echo 'Forbidden authority literal in DEV session manager' >&2
            exit 1
          fi
          grep -q "expansion.production" experimental/dev-zone/DevSession.php
          if grep -RniE '(session_id|token)=' experimental/dev-zone/dev-client.js; then
            echo 'Preferred DEV browser client must not put credentials in query strings' >&2
            exit 1
          fi
          grep -q "endpoint = 'dev-api.php'" experimental/dev-zone/dev-client.js
          grep -q "postAuthenticated('dev-expansion.php'" experimental/dev-zone/dev-client.js
          if grep -Rni '\$_GET' experimental/dev-zone/runtime/dev-auth.php experimental/dev-zone/runtime/dev-api.php experimental/dev-zone/runtime/dev-expansion.php; then
            echo 'Primary DEV auth/API/expansion endpoints must not accept query-string credentials or operations' >&2
            exit 1
          fi
          grep -q "HTTP_X_KICOM_DEV_SESSION" experimental/dev-zone/runtime/dev-expansion.php
          grep -q "expansion.test.execute" experimental/dev-zone/runtime/dev-expansion.php
          grep -q "EXECUTE_SANDBOX" experimental/dev-zone/runtime/dev-expansion.php
          grep -q "REPAIR_SANDBOX_FEDERATION" experimental/dev-zone/runtime/dev-expansion.php
          grep -q "QUERY_SANDBOX_PERCEPTION" experimental/dev-zone/runtime/dev-expansion.php
          grep -q "PERCEPTION_QUERY" experimental/dev-zone/DevSandboxPerception.php
          grep -q "PERCEPTION_QUERY_RESULT" experimental/dev-zone/DevSandboxPerception.php
          grep -q "verifyEnvelope" experimental/dev-zone/DevSandboxPerception.php
          grep -q "RESOURCE_ALIAS='sandbox'" experimental/dev-zone/DevExpansionBindings.php
          grep -q "TARGET_BASE_URL='https://sandbox.rurtalbahn.info'" experimental/dev-zone/DevExpansionBindings.php
          grep -q "EXPECTED_BUGGY_FEDERATION_SHA='d648b1b20c41f39049aa4cabd23ced3d9794cf2c1e92e602886b2e2674730653'" experimental/dev-zone/DevExpansionBindings.php
          grep -q 'perception_action_ready' experimental/dev-zone/DevExpansionBindings.php
          grep -q 'world_model_ready' experimental/dev-zone/DevExpansionBindings.php
          if grep -q 'dev-expansion.php' experimental/dev-zone/runtime/dev-bridge.php; then
            echo 'GET bridge must not delegate sandbox expansion execution' >&2
            exit 1
          fi
          grep -q "credential_scope.*dev-only" experimental/dev-zone/runtime/dev-bridge.php
          grep -q "require dirname(__DIR__).'/dev-bridge.php'" experimental/dev-zone/runtime/agent/index.php
          grep -q "new URL('agent/'" experimental/dev-zone/runtime/index.html
          grep -q "DEV_OPERATION_FORBIDDEN" experimental/dev-zone/DevRouter.php
          if grep -n 'kicomReceiveSelfUpdatePackage' experimental/dev-zone/DevKiComBindings.php; then
            echo 'DEV candidate export must not enter the self-update pending/install pipeline' >&2
            exit 1
          fi
          grep -q 'withSessionLock' experimental/dev-zone/DevSession.php
          grep -A18 'public function revoke' experimental/dev-zone/DevSession.php | grep -q 'withSessionLock'
          grep -q "DEV_LOG_STREAM_FORBIDDEN" experimental/dev-zone/DevDiagnostics.php
          grep -q "DEV_DOCTOR_OK" experimental/dev-zone/DevObserver.php

      - name: DEV session and passkey selftest
        run: php experimental/dev-zone/dev-selftest.php

      - name: DEV router boundary selftest
        run: php experimental/dev-zone/dev-router-selftest.php

      - name: DEV HTTP adapter selftest
        run: php experimental/dev-zone/dev-http-selftest.php

      - name: KiCom runtime binding selftest
        run: php experimental/dev-zone/dev-bindings-selftest.php

      - name: DEV diagnostics selftest
        run: php experimental/dev-zone/dev-diagnostics-selftest.php

      - name: DEV observer selftest
        run: php experimental/dev-zone/dev-observer-selftest.php

      - name: DEV sandbox expansion binding selftest
        run: php experimental/dev-zone/dev-expansion-selftest.php

      - name: Build install-oriented candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/kicom-dev-zone-v1/dev/agent
          mkdir -p dist/kicom-dev-zone-v1/dev/expansion/cell-runtime
          cp experimental/passkey-auth/PasskeyBridge.php dist/kicom-dev-zone-v1/dev/
          cp experimental/passkey-auth/browser.js dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevSession.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevAuthAdapter.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevAuthFlow.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevRouter.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevHttpAdapter.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevKiComBindings.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevDiagnostics.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevObserver.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevExpansionBindings.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/DevSandboxPerception.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/dev-client.js dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-auth.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-api.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-expansion.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/doctor.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/dev-bridge.php dist/kicom-dev-zone-v1/dev/
          cp experimental/dev-zone/runtime/agent/index.php dist/kicom-dev-zone-v1/dev/agent/
          cp experimental/dev-zone/runtime/index.html dist/kicom-dev-zone-v1/dev/

          for f in ExpansionProtocol.php ExpansionRegistry.php ExpansionFtpDeployer.php ExpansionLocalFilesystemDeployer.php ExpansionManagedCellUpdater.php ExpansionKiComDeployTargetResolver.php ExpansionCronRelay.php ExpansionCellPackageBuilder.php ExpansionHttpTransport.php ExpansionOrchestrator.php ExpansionParentIdentity.php ExpansionService.php CellNode.php CellLiving.php CellPerceptionAction.php CellWorldModel.php; do
            cp "experimental/expansion-cell/$f" "dist/kicom-dev-zone-v1/dev/expansion/$f"
          done
          cp experimental/expansion-cell/cell-runtime/common.php dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/
          cp experimental/expansion-cell/cell-runtime/bootstrap.php dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/
          cp experimental/expansion-cell/cell-runtime/federation.php dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/
          cp experimental/expansion-cell/cell-runtime/status.php dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/
          cp experimental/expansion-cell/cell-runtime/doctor.php dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/
          cp experimental/expansion-cell/cell-runtime/living-schema.json dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/
          cp experimental/expansion-cell/cell-runtime/.htaccess dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/

          cp experimental/dev-zone/manifest.json dist/kicom-dev-zone-v1/
          cp experimental/dev-zone/README.md dist/kicom-dev-zone-v1/
          php -l dist/kicom-dev-zone-v1/dev/DevAuthAdapter.php
          php -l dist/kicom-dev-zone-v1/dev/DevAuthFlow.php
          php -l dist/kicom-dev-zone-v1/dev/DevDiagnostics.php
          php -l dist/kicom-dev-zone-v1/dev/DevObserver.php
          php -l dist/kicom-dev-zone-v1/dev/DevExpansionBindings.php
          php -l dist/kicom-dev-zone-v1/dev/DevSandboxPerception.php
          php -l dist/kicom-dev-zone-v1/dev/dev-auth.php
          php -l dist/kicom-dev-zone-v1/dev/dev-api.php
          php -l dist/kicom-dev-zone-v1/dev/dev-expansion.php
          php -l dist/kicom-dev-zone-v1/dev/doctor.php
          php -l dist/kicom-dev-zone-v1/dev/dev-bridge.php
          php -l dist/kicom-dev-zone-v1/dev/agent/index.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/ExpansionService.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/ExpansionManagedCellUpdater.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/ExpansionKiComDeployTargetResolver.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/CellLiving.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/CellPerceptionAction.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/CellWorldModel.php
          php -l dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/doctor.php
          test -f dist/kicom-dev-zone-v1/dev/DevSandboxPerception.php
          test -f dist/kicom-dev-zone-v1/dev/expansion/CellLiving.php
          test -f dist/kicom-dev-zone-v1/dev/expansion/CellPerceptionAction.php
          test -f dist/kicom-dev-zone-v1/dev/expansion/CellWorldModel.php
          test -f dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/living-schema.json
          test -f dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/.htaccess
          grep -q 'perception_action_memory' dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/living-schema.json
          grep -q 'persistent-situational-awareness' dist/kicom-dev-zone-v1/dev/expansion/cell-runtime/living-schema.json
          (cd dist && zip -qr kicom-dev-zone-v1.zip kicom-dev-zone-v1)
          sha256sum dist/kicom-dev-zone-v1.zip | tee dist/kicom-dev-zone-v1.zip.sha256

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: kicom-dev-zone-v1
          path: |
            dist/kicom-dev-zone-v1.zip
            dist/kicom-dev-zone-v1.zip.sha256
          if-no-files-found: error
          retention-days: 14