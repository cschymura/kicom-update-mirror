name: KiCom Skill Cultivation v1

on:
  push:
    branches: [candidate/expansion-cell-v1]
    paths:
      - 'experimental/skill-cultivation/**'
      - 'candidates/skill-cultivation-v1/**'
      - '.github/workflows/skill-cultivation-v1.yml'
  pull_request:
    paths:
      - 'experimental/skill-cultivation/**'
      - 'candidates/skill-cultivation-v1/**'
      - '.github/workflows/skill-cultivation-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l experimental/skill-cultivation/SkillCultivation.php
          php -l experimental/skill-cultivation/SkillCultivationV2.php
          php -l experimental/skill-cultivation/SkillCultivationBridge.php
          php -l experimental/skill-cultivation/skill-cultivation-selftest.php
          php -l experimental/skill-cultivation/skill-cultivation-v2-selftest.php

      - name: Canonical candidate JSON
        run: |
          python -m json.tool candidates/skill-cultivation-v1/CANONICAL_MEMORY_PATCH.json >/dev/null

      - name: Boundary static checks
        shell: bash
        run: |
          set -euo pipefail
          for f in experimental/skill-cultivation/SkillCultivation.php experimental/skill-cultivation/SkillCultivationV2.php experimental/skill-cultivation/SkillCultivationBridge.php; do
            ! grep -nE '\b(shell_exec|exec|system|passthru|proc_open|popen)\s*\(' "$f"
            ! grep -nE '\b(curl_init|fsockopen|stream_socket_client)\s*\(' "$f"
          done
          f=experimental/skill-cultivation/SkillCultivationV2.php
          grep -q "external_permission_grant.*FORBIDDEN" "$f"
          grep -q "protected_external_action.*EXTERNAL_AUTH_REQUIRED" "$f"
          grep -q "history_hard_delete.*FORBIDDEN" "$f"
          grep -q "immutable-non-negotiable-boundaries" "$f"
          b=experimental/skill-cultivation/SkillCultivationBridge.php
          grep -q "evidence-only; never grants external permission" "$b"
          grep -q "EXPERIENCE_IGNORED" "$b"

      - name: Functional selftests
        run: |
          php experimental/skill-cultivation/skill-cultivation-selftest.php
          php experimental/skill-cultivation/skill-cultivation-v2-selftest.php

      - name: Policy candidate checks
        shell: bash
        run: |
          set -euo pipefail
          f=candidates/skill-cultivation-v1/CANONICAL_MEMORY_PATCH.json
          grep -q '"id": "D025"' "$f"
          grep -q '"id": "D026"' "$f"
          grep -q '"id": "D027"' "$f"
          grep -q '"live_mutation_performed": false' "$f"
          grep -q 'Human-at-the-boundary' "$f"
          grep -q '"0.9.16_g17"' "$f"
          grep -q '"0.9.17_g18"' "$f"
