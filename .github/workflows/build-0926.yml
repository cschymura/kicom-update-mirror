name: Build KiCom 0.9.26

on:
  push:
    branches:
      - work/kicom-0.9.26
    paths:
      - tools/build_0926_trusted_dev_sqlite.py
      - .github/workflows/build-0926.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/kicom-0.9.26
          fetch-depth: 0

      - name: Fetch reviewed DEV and passkey sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin candidate/dev-zone-v1:refs/remotes/origin/candidate/dev-zone-v1
          git fetch origin candidate/passkey-auth-resilience-v1:refs/remotes/origin/candidate/passkey-auth-resilience-v1
          rm -rf /tmp/kicom-dev-src /tmp/kicom-passkey-src /tmp/kicom-0926
          mkdir -p /tmp/kicom-dev-src /tmp/kicom-passkey-src /tmp/kicom-0926

          for f in DevSession.php DevAuthAdapter.php DevAuthFlow.php DevRouter.php DevHttpAdapter.php DevKiComBindings.php DevDiagnostics.php; do
            git show "refs/remotes/origin/candidate/dev-zone-v1:experimental/dev-zone/$f" > "/tmp/kicom-dev-src/$f"
          done
          for f in dev-selftest.php dev-router-selftest.php dev-http-selftest.php dev-bindings-selftest.php dev-diagnostics-selftest.php; do
            git show "refs/remotes/origin/candidate/dev-zone-v1:experimental/dev-zone/$f" > "/tmp/kicom-dev-src/$f"
          done

          for f in PasskeyBridge.php security-selftest.php selftest.php; do
            git show "refs/remotes/origin/candidate/passkey-auth-resilience-v1:experimental/passkey-auth/$f" > "/tmp/kicom-passkey-src/$f"
          done

      - name: Build 0.9.26 source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_0926_trusted_dev_sqlite.py \
            --base source/0.9.25 \
            --dev /tmp/kicom-dev-src \
            --passkey /tmp/kicom-passkey-src \
            --out /tmp/kicom-0926/source

      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do php -l "$f"; done < <(find /tmp/kicom-0926/source -type f -name '*.php' -print0)

      - name: Passkey security selftest
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/kicom-passkey-src/security-selftest.php

      - name: DEV unit boundary selftests
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kicom-passkey-src/PasskeyBridge.php /tmp/kicom-dev-src/PasskeyBridge.php
          php /tmp/kicom-dev-src/dev-selftest.php
          php /tmp/kicom-dev-src/dev-router-selftest.php
          php /tmp/kicom-dev-src/dev-http-selftest.php
          php /tmp/kicom-dev-src/dev-diagnostics-selftest.php

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases/0.9.26 source/0.9.26 build/status/0.9.26.json
          mkdir -p releases/0.9.26 source/0.9.26 build/status
          cp -a /tmp/kicom-0926/source/. source/0.9.26/

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('source/0.9.26')
          manifest=src/'MANIFEST.sha256'
          paths=[]
          for line in manifest.read_text().splitlines():
              if not line.strip(): continue
              _,p=line.split(None,1)
              paths.append(p.strip())
          out=Path('releases/0.9.26/KiCom-0.9.26.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in paths:
                  z.write(src/p,p)
              z.write(manifest,'MANIFEST.sha256')
          PY

      - name: Verify with unchanged 0.9.25 verifier
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(pwd)/releases/0.9.26/KiCom-0.9.26.zip"
          php -r '
            chdir("source/0.9.25");
            require "lib.php";
            $zip=$argv[1];
            $x=kicomSelfUpdateZipInspect($zip);
            if(empty($x["ok"])){fwrite(STDERR,"VERIFIER_REJECTED ".($x["code"]??"UNKNOWN")."\n");exit(2);}
            $r=kicomSelfUpdateRiskClass($x);
            echo "VERIFIER_OK risk=".($r["class"]??"unknown")." files=".count($x["entries"]??[])."\n";
          ' "$ZIP"

      - name: Static authority checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "production_requires_totp'=>true" source/0.9.26/living.php
          grep -q "red_requires_totp'=>false" source/0.9.26/living.php
          grep -q "internal_self_update'=>true" source/0.9.26/living.php
          grep -q "DEV_CAPABILITY_FORBIDDEN" source/0.9.26/modules/dev/DevSession.php
          ! grep -RIE "shell_exec|exec\(|system\(|passthru\(|proc_open|popen\(" source/0.9.26/modules/dev
          ! grep -RIE "xox[baprs]-[A-Za-z0-9-]{10,}|otpauth://|BEGIN[[:space:]]+PRIVATE[[:space:]]+KEY" source/0.9.26/modules/dev

      - name: Record source/release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,datetime,subprocess
          src=Path('source/0.9.26')
          z=Path('releases/0.9.26/KiCom-0.9.26.zip')
          zsha=hashlib.sha256(z.read_bytes()).hexdigest()
          meta={
            "schema":1,
            "version":"0.9.26",
            "source_version":"0.9.25",
            "genome":"kicom-0.9.26-g25",
            "release_file":str(z),
            "release_sha256":zsha,
            "built_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "branch":"work/kicom-0.9.26",
            "dev_backend":"trusted-modules",
            "sqlite_hardening":True,
            "authority_model":"risk-separated-from-authority"
          }
          (src/'SOURCE-SNAPSHOT.json').write_text(json.dumps(meta,indent=2)+"\n")
          Path('build/status/0.9.26.json').write_text(json.dumps(meta|{"status":"verified_candidate"},indent=2)+"\n")
          print(json.dumps(meta,indent=2))
          PY
          sha256sum releases/0.9.26/KiCom-0.9.26.zip > releases/0.9.26/SHA256SUMS.txt

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kicom-mirror-bot'
          git config user.email 'kicom-mirror-bot@users.noreply.github.com'
          git add source/0.9.26 releases/0.9.26 build/status/0.9.26.json
          if git diff --cached --quiet; then
            echo "Candidate already current."
            exit 0
          fi
          git commit -m 'KiCom 0.9.26 verified candidate'
          git push origin HEAD:work/kicom-0.9.26
