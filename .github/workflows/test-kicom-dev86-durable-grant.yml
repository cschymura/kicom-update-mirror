name: KiCom DEV86 durable write-grant nonce
on:
  push:
    branches:
      - work/kicom-engram-dev86-durable-grant-nonce
    paths:
      - 'development/0.9.27/engram/dev72/**'
      - 'development/0.9.27/engram/dev75/**'
      - 'development/0.9.27/engram/dev76/**'
      - 'development/0.9.27/engram/dev86/**'
      - '.github/workflows/test-kicom-dev86-durable-grant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-grant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
          coverage: none
      - name: Exact development source lint and real PDO SQLite tests
        run: |
          set -euo pipefail
          php -m | grep -i pdo_sqlite
          php -l development/0.9.27/engram/dev72/KiComEngramWriteGrant.php
          php -l development/0.9.27/engram/dev75/KiComEngramRevisionAdapter.php
          php -l development/0.9.27/engram/dev76/KiComEngramCanonicalMutationService.php
          php -l development/0.9.27/engram/dev76/KiComEngramCanonicalMcpMutationController.php
          php -l development/0.9.27/engram/dev86/test_durable_grant_nonce.php
          php development/0.9.27/engram/dev76/test_canonical_e2e.php
          php development/0.9.27/engram/dev86/test_durable_grant_nonce.php
