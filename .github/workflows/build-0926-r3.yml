name: Build KiCom 0.9.26 R3

on:
  push:
    branches: [work/kicom-0.9.26]
    paths:
      - tools/fix_0926_r3_reentrancy.py
      - .github/workflows/build-0926-r3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/kicom-0.9.26
          fetch-depth: 0

      - name: Fetch reviewed DEV and passkey sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin candidate/dev-zone-v1:refs/remotes/origin/candidate/dev-zone-v1
          git fetch origin candidate/passkey-auth-resilience-v1:refs/remotes/origin/candidate/passkey-auth-resilience-v1
          rm -rf /tmp/kicom-dev-src /tmp/kicom-passkey-src /tmp/kicom-0926-r3 /tmp/kicom-0926-r3-smoke
          mkdir -p /tmp/kicom-dev-src /tmp/kicom-passkey-src /tmp/kicom-0926-r3
          for f in DevSession.php DevAuthAdapter.php DevAuthFlow.php DevRouter.php DevHttpAdapter.php DevKiComBindings.php DevDiagnostics.php dev-selftest.php dev-router-selftest.php dev-http-selftest.php dev-diagnostics-selftest.php; do
            git show "refs/remotes/origin/candidate/dev-zone-v1:experimental/dev-zone/$f" > "/tmp/kicom-dev-src/$f"
          done
          for f in PasskeyBridge.php security-selftest.php selftest.php; do
            git show "refs/remotes/origin/candidate/passkey-auth-resilience-v1:experimental/passkey-auth/$f" > "/tmp/kicom-passkey-src/$f"
          done

      - name: Build and apply R3 runtime fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_0926_trusted_dev_sqlite.py --base source/0.9.25 --dev /tmp/kicom-dev-src --passkey /tmp/kicom-passkey-src --out /tmp/kicom-0926-r3/source
          python3 tools/fix_0926_r3_reentrancy.py --source /tmp/kicom-0926-r3/source
          while IFS= read -r -d '' f; do php -l "$f"; done < <(find /tmp/kicom-0926-r3/source -type f -name '*.php' -print0)
          php /tmp/kicom-passkey-src/security-selftest.php
          cp /tmp/kicom-passkey-src/PasskeyBridge.php /tmp/kicom-dev-src/PasskeyBridge.php
          php /tmp/kicom-dev-src/dev-selftest.php
          php /tmp/kicom-dev-src/dev-router-selftest.php
          php /tmp/kicom-dev-src/dev-http-selftest.php
          php /tmp/kicom-dev-src/dev-diagnostics-selftest.php

      - name: Runtime memory SQLite backup and tamper smoke
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/kicom-0926-r3/source /tmp/kicom-0926-r3-smoke
          rm -rf /tmp/kicom-0926-r3-smoke/var
          mkdir -p /tmp/kicom-0926-r3-smoke/var/project_memory
          cp /tmp/kicom-0926-r3/source/var/.htaccess /tmp/kicom-0926-r3-smoke/var/.htaccess
          cp source/0.9.25/memory/*.kcl /tmp/kicom-0926-r3-smoke/var/project_memory/
          php -d display_errors=1 -r '
            chdir($argv[1]); require "lib.php";
            if(!kicomEnsureStorage())exit(41);
            foreach(kicomMemoryResources() as $name=>$filename){
              $seed=file_get_contents(kicomMemorySeedDir()."/".$filename); $cur=kicomReadMemoryResource($name);
              if(!is_array($cur)||!hash_equals(hash("sha256",$seed),(string)$cur["sha256"]))exit(42);
              if(kicomMemoryHistoryCount($name)<2)exit(43);
            }
            if(!is_file(kicomMemoryStateDir()."/.release-sync-0.9.26.json"))exit(44);
            if(!function_exists("kicomDevReady"))exit(45);
            $db=kicomSqliteDb(); if(!$db)exit(46);
            $row=["at"=>"2026-09-18T18:00:00+00:00","type"=>"ci_dedupe","severity"=>"info","payload"=>"same"];
            if(!kicomSqliteEventAppend("ci",$row,null))exit(47);
            if(kicomSqliteEventAppend("ci",$row,null))exit(48);
            $snap=kicomSqliteSnapshot("ci-r3"); if(empty($snap["ok"]))exit(49);
            $diag=kicomSqliteDiagnostics(); if(empty($diag["ok"])||((int)$diag["duplicate_sha_rows"])!==0)exit(50);
            $bad=str_repeat("0",64); $db->exec("UPDATE schema_migrations SET checksum=".$db->quote($bad)." WHERE version=1");
            if(kicomSqliteDb(true) instanceof PDO)exit(51);
            echo "R3_RUNTIME_SMOKE_OK\n";
          ' /tmp/kicom-0926-r3-smoke

      - name: Package and verify with unchanged 0.9.25 verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/0.9.26-r3 build/status/0.9.26-r3.json
          rm -f releases/0.9.26/KiCom-0.9.26-R3.zip releases/0.9.26/SHA256SUMS-R3.txt
          mkdir -p source/0.9.26-r3 releases/0.9.26 build/status
          cp -a /tmp/kicom-0926-r3/source/. source/0.9.26-r3/
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path('source/0.9.26-r3'); out=Path('releases/0.9.26/KiCom-0.9.26-R3.zip')
          paths=[line.split(None,1)[1].strip() for line in (src/'MANIFEST.sha256').read_text().splitlines() if line.strip()]
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in paths: z.write(src/p,p)
              z.write(src/'MANIFEST.sha256','MANIFEST.sha256')
          PY
          ZIP="$(pwd)/releases/0.9.26/KiCom-0.9.26-R3.zip"
          php -r 'chdir("source/0.9.25");require "lib.php";$x=kicomSelfUpdateZipInspect($argv[1]);if(empty($x["ok"]))exit(61);if(($x["version"]??"")!=="0.9.26"||($x["genome"]["id"]??"")!=="kicom-0.9.26-g25r3")exit(62);$r=kicomSelfUpdateRiskClass($x);echo "VERIFIER_OK risk=".($r["class"]??"unknown")." genome=".$x["genome"]["id"]."\n";' "$ZIP"
          grep -q 'static $syncing=false;' source/0.9.26-r3/lib.php
          grep -q "production_requires_totp'=>true" source/0.9.26-r3/living.php
          grep -q "red_requires_totp'=>false" source/0.9.26-r3/living.php
          grep -q 'DEV_CAPABILITY_FORBIDDEN' source/0.9.26-r3/modules/dev/DevSession.php
          ! grep -RIE 'shell_exec|exec\(|system\(|passthru\(|proc_open|popen\(' source/0.9.26-r3/modules/dev
          sha256sum "$ZIP" > releases/0.9.26/SHA256SUMS-R3.txt

      - name: Record verified R3 and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,datetime
          z=Path('releases/0.9.26/KiCom-0.9.26-R3.zip')
          meta={"schema":1,"version":"0.9.26","release_revision":"R3","source_version":"0.9.25","genome":"kicom-0.9.26-g25r3","release_file":str(z),"release_sha256":hashlib.sha256(z.read_bytes()).hexdigest(),"built_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"branch":"work/kicom-0.9.26","dev_backend":"trusted-modules","sqlite_hardening":True,"memory_sync":"revision-preserving-reentrant-safe","authority_model":"risk-separated-from-authority","status":"verified_candidate_r3"}
          Path('source/0.9.26-r3/SOURCE-SNAPSHOT.json').write_text(json.dumps(meta,indent=2)+'\n')
          Path('build/status/0.9.26-r3.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          git config user.name 'kicom-mirror-bot'
          git config user.email 'kicom-mirror-bot@users.noreply.github.com'
          git add source/0.9.26-r3 releases/0.9.26/KiCom-0.9.26-R3.zip releases/0.9.26/SHA256SUMS-R3.txt build/status/0.9.26-r3.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'KiCom 0.9.26 R3 verified candidate'
          git push origin HEAD:work/kicom-0.9.26
