name: KiCom DEV88 verified memory provenance
on:
  push:
    branches:
      - work/kicom-engram-dev88-provenance-binding
    paths:
      - 'development/0.9.27/engram/dev75/**'
      - 'development/0.9.27/engram/dev76/**'
      - 'development/0.9.27/engram/dev86/**'
      - 'development/0.9.27/engram/dev87/**'
      - 'development/0.9.27/engram/dev88/**'
      - '.github/workflows/test-kicom-dev88-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3
          coverage: none
      - name: PHP lint and private PDO SQLite writing and provenance regressions
        run: |
          set -euo pipefail
          php -m | grep -i pdo_sqlite
          php -l development/0.9.27/engram/dev75/KiComEngramRevisionAdapter.php
          php -l development/0.9.27/engram/dev76/KiComEngramCanonicalMutationService.php
          php -l development/0.9.27/engram/dev88/KiComEngramVerifiedWriteProvenance.php
          php -l development/0.9.27/engram/dev88/test_verified_provenance.php
          php development/0.9.27/engram/dev88/test_verified_provenance.php
          php development/0.9.27/engram/dev87/test_explicit_private_schema.php
          php development/0.9.27/engram/dev76/test_canonical_e2e.php
          php development/0.9.27/engram/dev86/test_durable_grant_nonce.php
