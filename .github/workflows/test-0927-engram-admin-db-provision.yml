name: Mirage KiCom admin private database provisioning
on:
  push:
    branches: [work/kicom-0.9.27-pam]
    paths:
      - 'development/0.9.27/engram/KiComEngramAdminDbProvisionHttp.php'
      - 'development/0.9.27/engram/test-engram-admin-db-provision.php'
      - 'development/0.9.27/engram/KiComEngramInactiveDbProvisioner.php'
      - '.github/workflows/test-0927-engram-admin-db-provision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-db:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,sqlite3,openssl
          coverage: none
      - name: Verify immutable original release
        shell: bash
        run: |
          set -euo pipefail
          echo '6e93e7b176ce429a922cb5e5906e90046f68c38fb3a8fb1b5cabcd529b56dd1f  releases/0.9.26/KiCom-0.9.26-R3.zip' | sha256sum -c -
          (cd source/0.9.26-r3 && sha256sum --status -c MANIFEST.sha256)
      - name: Lint and test original admin create-only inactive DB setup
        shell: bash
        run: |
          set -euo pipefail
          for file in KiComEngramAdminDbProvisionHttp.php KiComEngramInactiveDbProvisioner.php KiComEngramOAuthTransactions.php KiComEngramActivationTransaction.php KiComEngramActivationReadinessGate.php test-engram-admin-db-provision.php; do
            php -l "development/0.9.27/engram/$file"
          done
          php development/0.9.27/engram/test-engram-admin-db-provision.php
